name: Публикация Python SDK на PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Проверка и сборка SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Получить исходники релиза
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Установить uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"

      - name: Сверить тег релиза с версией пакета
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --python 3.11 python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          # Версия в пакете должна совпадать с версией опубликованного релиза.
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected_tag = f"v{project['version']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Тег GitHub Release должен быть {expected_tag} по версии в pyproject.toml.")
          PY

      - name: Проверить SDK на Python 3.11
        run: |
          uv sync --locked --python 3.11
          uv run --no-sync pytest
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src

      - name: Собрать wheel и архив исходников
        run: uv build --python 3.11 --no-sources

      - name: Передать файлы в задачу публикации
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Публикация на PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mindvoice-sdk/
    # OIDC-токен доступен только задаче, которая загружает готовые файлы на PyPI.
    permissions:
      id-token: write
    steps:
      - name: Получить собранные файлы
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Опубликовать mindvoice-sdk
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
